name: Runner Pattern Analyzer

on:
  workflow_dispatch:
  # Schedule deaktiviert: Research-Tool, kein Dauerbetrieb noetig.
  # Ausserdem liefern zwei Spalten derzeit falsche Werte
  # (first_hour_max_gain misst die LETZTEN 60 Min, jup_price_impact ist
  # konstant -1.0). Erst reparieren, dann wieder takten.
  # schedule:
  #   - cron: '30 */6 * * *'

concurrency:
  group: solana-bot-repo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Pattern Analysis
        env:
          PYTHONUNBUFFERED: "1"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python analyze_runners.py