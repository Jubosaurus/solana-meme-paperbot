name: Copy Trading (Paper)

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "normal oder probe (Kurztest)"
        required: true
        default: probe
        type: choice
        options:
          - normal
          - probe
  # Sicherheitsnetz wie beim Hauptbot, versetzt auf Minute 47, seit 06.10. stuendlich (vorher alle 6 h). Normalerweise startet jede Schicht selbst die naechste.
  schedule:
    - cron: '47 * * * *'

# Eigene Gruppe: laeuft parallel zum Hauptbot, aber nie zweimal gleichzeitig
concurrency:
  group: copy-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  copy-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Copy-Bot starten
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_COPY: ${{ secrets.DISCORD_WEBHOOK_COPY }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          PYTHONUNBUFFERED: 1
        run: |
          if [ "${{ github.event.inputs.modus }}" = "probe" ]; then
            python copy_bot.py --probe
          else
            python copy_bot.py
          fi

      # Sichert nur den Ordner copy/, die Dateien des Hauptbots bleiben unberuehrt
      - name: Sicherung
        if: always() && github.event.inputs.modus != 'probe'
        id: sicherung
        continue-on-error: true   # Fehler wird ganz unten sichtbar gemacht, der Kettenstart darf nicht ausfallen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then git rebase --abort || true; fi
          # Bis zu 4 Versuche: jedes Mal frisch auf den neuesten Stand von main setzen (Daten nie mischen), neu committen, pushen
          ok=0
          for versuch in 1 2 3 4; do
            git fetch -q origin main && git reset -q origin/main || { sleep $((versuch * 5)); continue; }
            staging=1
            if [ -e copy ]; then git add copy || staging=0; fi
            [ "$staging" = 1 ] || { sleep $((versuch * 5)); continue; }      # Staging-Fehler = gescheiterter Versuch
            if git diff --cached --quiet; then ok=1; break; fi
            git commit -q -m "COPY Sicherung [skip ci]"
            if git push -q origin HEAD:main; then ok=1; break; fi
            sleep $((versuch * 5))
          done
          if [ "$ok" != 1 ]; then echo "::error::Sicherung fehlgeschlagen (4 Versuche)"; exit 1; fi

      - name: Naechste Schicht starten
        if: success() && github.event.inputs.modus != 'probe'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run copy_runner.yml --ref main -f modus=normal || echo "::warning::Naechste Schicht konnte nicht gestartet werden"

      # Ganz am Ende, damit der Kettenstart oben nicht ausfaellt: ein fehlgeschlagener Push macht den Lauf sichtbar rot
      - name: Sicherung pruefen
        if: always() && steps.sicherung.outcome == 'failure'
        run: |
          echo "::error::Die letzte Sicherung ist fehlgeschlagen, Daten seit dem letzten Zwischen-Push koennen fehlen"
          exit 1
