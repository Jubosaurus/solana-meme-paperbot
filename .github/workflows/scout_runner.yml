name: Wallet-Scout

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "normal, pruefliste (nur scout/pruefen.txt, ohne Coin-Suche und Birdeye) oder probe (Kurztest)"
        required: true
        default: probe
        type: choice
        options:
          - normal
          - pruefliste
          - probe
  # Seit 04.10. stuendlich angestossen: GitHub hat geplante Laeufe ausgelassen oder bis zu 6 h spaeter gestartet.
  # Der Scout laeuft trotzdem nur einmal je 6-h-Fenster (00, 06, 12, 18 UTC), sonst endet er sofort (--wenn-faellig).
  schedule:
    - cron: '29 * * * *'

concurrency:
  group: wallet-scout
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Scout starten
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_COPY: ${{ secrets.DISCORD_WEBHOOK_COPY }}
          DISCORD_WEBHOOK_SCOUT: ${{ secrets.DISCORD_WEBHOOK_SCOUT }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          PYTHONUNBUFFERED: 1
        run: |
          if [ "${{ github.event.inputs.modus }}" = "probe" ]; then
            python scout_bot.py --probe
          elif [ "${{ github.event.inputs.modus }}" = "pruefliste" ]; then
            python scout_bot.py --nur-pruefliste
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python scout_bot.py --wenn-faellig
          else
            python scout_bot.py
          fi

      # Sichert nur den Ordner scout/ (copy_wallets.txt committet die Automatik im Scout selbst)
      - name: Sicherung
        if: always() && github.event.inputs.modus != 'probe'
        id: sicherung
        continue-on-error: true   # Fehler wird ganz unten sichtbar gemacht, der Kettenstart darf nicht ausfallen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Bis zu 4 Versuche: jedes Mal frisch auf den neuesten Stand von main setzen (Daten nie mischen), neu committen, pushen
          ok=0
          for versuch in 1 2 3 4; do
            git fetch -q origin main && git reset -q origin/main || { sleep $((versuch * 5)); continue; }
            staging=1
            # Die Pruefliste schreibt nur das Dashboard (dashboard/wallets.py): nie die alte Fassung vom Laufanfang zurueckschreiben
            if [ -e scout ]; then git add scout ':!scout/pruefen.txt' ':!scout/pruefen_tx.txt' || staging=0; fi
            [ "$staging" = 1 ] || { sleep $((versuch * 5)); continue; }      # Staging-Fehler = gescheiterter Versuch
            if git diff --cached --quiet; then ok=1; break; fi
            git commit -q -m "SCOUT Sicherung [skip ci]"
            if git push -q origin HEAD:main; then ok=1; break; fi
            sleep $((versuch * 5))
          done
          if [ "$ok" != 1 ]; then echo "::error::Sicherung fehlgeschlagen (4 Versuche)"; exit 1; fi

      # Ganz am Ende, damit der Kettenstart oben nicht ausfaellt: ein fehlgeschlagener Push macht den Lauf sichtbar rot
      - name: Sicherung pruefen
        if: always() && steps.sicherung.outcome == 'failure'
        run: |
          echo "::error::Die letzte Sicherung ist fehlgeschlagen, Daten seit dem letzten Zwischen-Push koennen fehlen"
          exit 1
