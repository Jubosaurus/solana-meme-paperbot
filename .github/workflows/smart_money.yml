name: Smart Money Profiler

on:
  workflow_dispatch:
  # Schedule deaktiviert: Research-Tool. Zusaetzlich liefert RugCheck seit
  # dem 17.09. kein topHolders-Array mehr (top10_holder_pct = 0.0 in
  # runner_patterns.csv), d.h. das Screening findet aktuell ohnehin keine
  # neuen Wallets. Erst pruefen, dann wieder takten.
  # schedule:
  #   - cron: '30 */6 * * *'

concurrency:
  group: solana-bot-repo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Smart Money Profiler
        env:
          PYTHONUNBUFFERED: "1"
          DISCORD_SMART_MONEY_WEBHOOK: ${{ secrets.DISCORD_SMART_MONEY_WEBHOOK }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python find_smart_traders.py