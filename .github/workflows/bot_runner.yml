name: Solana Paper Trading Bot

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "normal oder probe (Kurztest)"
        required: true
        default: probe
        type: choice
        options:
          - normal
          - probe
  # Sicherheitsnetz: normalerweise startet jede Schicht am Ende selbst die naechste (letzter Schritt).
  # Seit 06.10. stuendlich (vorher alle 6 h): Am 05.10. bekam ein Lauf von GitHub keinen Runner, die Kette riss 4 h.
  # Laeuft eine Schicht, wartet hoechstens ein Lauf in der Warteschlange (der neueste ersetzt den aelteren).
  # Minute 17 statt zur vollen Stunde, weil GitHub dort bei hoher Last Laeufe verzoegert oder verwirft.
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: solana-bot-repo
  cancel-in-progress: false

permissions:
  contents: write
  actions: write          # damit eine Schicht die naechste starten kann

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # Immer den NEUESTEN Stand von main laden, nicht den vom Ausloesezeitpunkt.
      # Wartet ein Lauf in der Schlange, waere der sonst Stunden alt.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Bot starten
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_TRACKER_API_KEY: ${{ secrets.SOLANA_TRACKER_API_KEY }}
          DISCORD_WEBHOOK_EXPERIMENTE: ${{ secrets.DISCORD_WEBHOOK_EXPERIMENTE }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event.inputs.modus }}" = "probe" ]; then
            python bot.py --probe
          else
            python bot.py
          fi

      - name: Sicherung
        if: always() && github.event.inputs.modus != 'probe'
        id: sicherung
        continue-on-error: true   # Fehler wird ganz unten sichtbar gemacht, der Kettenstart darf nicht ausfallen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then git rebase --abort || true; fi
          # Bis zu 4 Versuche: jedes Mal frisch auf den neuesten Stand von main setzen (Daten nie mischen), neu committen, pushen
          ok=0
          for versuch in 1 2 3 4; do
            git fetch -q origin main && git reset -q origin/main || { sleep $((versuch * 5)); continue; }
            staging=1
            for f in portfolio.json journal.csv abgelehnt.csv abgelehnt marktphase.json verlauf.csv verlauf knapp_abgelehnt.csv experimente messung.csv dexscreener.csv flugschreiber namenswellen.csv; do
              if [ -e "$f" ]; then git add "$f" || staging=0; fi
            done
            [ "$staging" = 1 ] || { sleep $((versuch * 5)); continue; }      # Staging-Fehler = gescheiterter Versuch
            if git diff --cached --quiet; then ok=1; break; fi
            git commit -q -m "NARRATIV Sicherung [skip ci]"
            if git push -q origin HEAD:main; then ok=1; break; fi
            sleep $((versuch * 5))
          done
          if [ "$ok" != 1 ]; then echo "::error::Sicherung fehlgeschlagen (4 Versuche)"; exit 1; fi

      # Kette: naechste Schicht direkt starten. Nur wenn alles erfolgreich war, damit ein kaputter
      # Stand nicht endlos neu startet (dann greift der Zeitplan oben). Nicht nach Abbruch von Hand.
      - name: Naechste Schicht starten
        if: success() && github.event.inputs.modus != 'probe'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot_runner.yml --ref main -f modus=normal || echo "::warning::Naechste Schicht konnte nicht gestartet werden"

      # Ganz am Ende, damit der Kettenstart oben nicht ausfaellt: ein fehlgeschlagener Push macht den Lauf sichtbar rot
      - name: Sicherung pruefen
        if: always() && steps.sicherung.outcome == 'failure'
        run: |
          echo "::error::Die letzte Sicherung ist fehlgeschlagen, Daten seit dem letzten Zwischen-Push koennen fehlen"
          exit 1
