name: Solana Paper Trading Bot

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "normal oder probe (Kurztest)"
        required: true
        default: probe
        type: choice
        options:
          - normal
          - probe
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: solana-bot-repo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Bot starten
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event.inputs.modus }}" = "probe" ]; then
            python bot.py --probe
          else
            python bot.py
          fi

      - name: Sicherung
        if: always() && github.event.inputs.modus != 'probe'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in portfolio.json journal.csv abgelehnt.csv marktphase.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          if ! git diff --cached --quiet; then
            git commit -m "NARRATIV Sicherung [skip ci]" || true
            git pull --rebase origin main || true
            git push origin main || true
          fi