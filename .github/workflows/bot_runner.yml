name: Solana Paper Trading Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: solana-trading-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Pull Latest Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true

      - name: Run Trading Bot (5 Stunden)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Führt den Bot direkt aus; beendet sich nach 5 Stunden selbst
          python bot.py

      - name: Commit and Push Updated CSVs
        if: always()  # Läuft garantiert immer, selbst wenn vorher etwas abgebrochen wird!
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add solana_paper_trades_v2.csv rejected_rugs_tracking.csv || true
          
          if git status --porcelain | grep -qE "solana_paper_trades_v2.csv|rejected_rugs_tracking.csv"; then
            git commit -m "Auto-Update: Trades & Rug-Muster CSVs aktualisiert [skip ci]"
            git pull origin main --rebase || true
            git push origin main
            echo "CSVs erfolgreich ins Repository gepusht."
          else
            echo "Keine Änderungen zum Committen vorhanden."
          fi
