# Nexus Core: Farben und Schriften nach DESIGN.md (CSS und Diagramm-Thema stehen in stil.py).
# Gruen/Rot nur fuer Leistungswerte, immer mit Pfeil und Vorzeichen.
[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#080B11"
secondaryBackgroundColor = "#0F172A"
textColor = "#E2E8F0"
borderColor = "#1E293B"
font = "Inter, sans-serif"
headingFont = "Space Grotesk, sans-serif"
codeFont = "JetBrains Mono, monospace"
baseRadius = "10px"
showSidebarBorder = true
chartCategoricalColors = ["#6366F1", "#10B981", "#F59E0B", "#38BDF8", "#F43F5E", "#A78BFA"]
blueColor = "#38BDF8"
violetColor = "#6366F1"
redColor = "#F43F5E"
greenColor = "#10B981"
orangeColor = "#F59E0B"
yellowColor = "#F59E0B"
grayColor = "#64748B"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter.woff2"
weight = "400 700"
style = "normal"

[[theme.fontFaces]]
family = "Space Grotesk"
url = "app/static/fonts/SpaceGrotesk.woff2"
weight = "500 700"
style = "normal"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/JetBrainsMono.woff2"
weight = "400 700"
style = "normal"

[theme.sidebar]
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#0F172A"

[server]
headless = false
port = 8501
address = "localhost"            # nur auf diesem Rechner erreichbar, nicht im Netzwerk
# Schutz gegen DNS-Rebinding (Sicherheitspruefung 07.10.): nur diese Host-Namen werden angenommen.
# start_handy.bat ersetzt die Liste per Umgebungsvariable um die Heimnetz-Adresse des PCs.
allowedHosts = ["localhost", "127.0.0.1", "::1"]
enableCORS = true
enableXsrfProtection = true
runOnSave = false
fileWatcherType = "none"
enableStaticServing = true       # Logo, Schriften, Symbole aus dashboard/static

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
