# Dunkles Design (Farben passend zu stil.py; eigenes CSS und Diagramm-Thema stehen dort).
# Gruen/Rot nur als Akzent, immer mit Pfeil und Vorzeichen.
[theme]
base = "dark"
primaryColor = "#8b7cf6"
backgroundColor = "#0c0a1d"
secondaryBackgroundColor = "#16132e"
textColor = "#ecebf7"
borderColor = "#2c2852"
font = "sans-serif"
baseRadius = "12px"
showSidebarBorder = false
chartCategoricalColors = ["#8b7cf6", "#4f8df5", "#1baf7a", "#eda100", "#e87ba4", "#9085e9"]
blueColor = "#4f8df5"
violetColor = "#8b7cf6"
redColor = "#ff6b7a"
greenColor = "#34c77b"
orangeColor = "#fab219"
yellowColor = "#fab219"
grayColor = "#8e8bab"

[theme.sidebar]
backgroundColor = "#0e0c22"
secondaryBackgroundColor = "#16132e"

[server]
headless = false
port = 8501
address = "localhost"            # nur auf diesem Rechner erreichbar, nicht im Netzwerk
runOnSave = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
